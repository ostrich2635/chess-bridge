<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, initial-scale=1.0">
  <title>Chess Analysis Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <span class="logo-icon">♞</span>
      <div class="logo-text">
        <h1>Chess <span class="gradient-text">Bridge</span></h1>
        <span class="badge">Extension</span>
      </div>
    </header>

    <div class="card glass">
      <div class="form-group">
        <label for="username">Chess.com Username</label>
        <input type="text" id="username" placeholder="e.g. MagnusCarlsen" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="token">Lichess Token <span class="optional">(Optional)</span></label>
        <div class="input-wrapper">
          <input type="password" id="token" placeholder="Optional for anonymous import" autocomplete="off">
          <button type="button" id="toggle-token">👁</button>
        </div>
      </div>

      <div class="toggle-group">
        <div class="toggle-info">
          <span class="toggle-label">Auto-import Games</span>
          <span class="toggle-desc">Instantly open Lichess when game ends</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="auto-import">
          <span class="slider"></span>
        </label>
      </div>

      <button id="save-btn" class="btn-primary">Save Settings</button>
      <div id="status-msg" class="status-msg hidden"></div>
    </div>

    <footer class="popup-footer">
      <a href="https://www.chess.com" target="_blank">Chess.com ↗</a>
      <span>•</span>
      <a href="https://lichess.org" target="_blank">Lichess ↗</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
